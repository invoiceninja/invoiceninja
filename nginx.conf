server {
    listen 80;
    root /var/www/app/public;
    index index.php index.html;

    # Security Headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;

    # REMOVE existing CORS from backend
    fastcgi_hide_header Access-Control-Allow-Origin;

    # Set correct CORS
    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "http://localhost:8000" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public$fastcgi_script_name;
    }
}