    BTRules:
      properties:
        data_key:
          description: 'The key to search'
          type: string
          example: 'description,amount'
        operator:
          description: 'The operator flag of the search'
          type: string
          example: '>'
        value:
          description: 'The value to search for'
          type: string
          example: bob
        search_key:
          description: 'The transaction field a debit rule matches: description, amount, participant or participant_name. Credit rules match on value instead'
          type: string
      type: object