    Design:
      properties:
        id:
          description: 'The design hashed id'
          type: string
          example: AS3df3A
          readOnly: true
        name:
          description: 'The design name'
          type: string
          example: Beauty
        design:
          description: 'The HTML sections of the design'
          type: object
          properties:
            includes:
              description: 'The <style> and <link> includes of the design, as HTML. The PDF is built from includes, header, body and footer in that order'
              type: string
            header:
              description: 'The header section of the design, as HTML. The PDF is built from includes, header, body and footer in that order'
              type: string
            body:
              description: 'The body section of the design, as HTML. The PDF is built from includes, header, body and footer in that order'
              type: string
            product:
              description: 'Legacy product table section, kept for older designs. It is not used when the PDF is built'
              type: string
            task:
              description: 'Legacy task table section, kept for older designs. It is not used when the PDF is built'
              type: string
            footer:
              description: 'The footer section of the design, as HTML. The PDF is built from includes, header, body and footer in that order'
              type: string
        is_custom:
          description: 'Flag to determine if the design is a custom user design'
          type: boolean
          example: true
        is_active:
          description: 'Flag to determine if the design is available for use'
          type: boolean
          example: true
        is_deleted:
          description: 'Flag to determine if the design is deleted'
          type: boolean
          example: true
        created_at:
          description: Timestamp
          type: integer
          example: 134341234234
        updated_at:
          description: Timestamp
          type: integer
          example: 134341234234
        archived_at:
          description: 'When the design was archived, as a Unix timestamp in seconds; 0 when it is not archived'
          type: integer
        entities:
          description: 'A comma separated list of the entities the design can be used for'
          type: string
        is_free:
          description: 'Whether the design is one of the built-in free designs (ids 1 to 4)'
          type: boolean
        is_template:
          description: 'Whether the design is a template (for statements, payment receipts and other template output) rather than an entity PDF design'
          type: boolean
      type: object