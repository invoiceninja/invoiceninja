    Design:
      properties:
        id:
          description: 'The design hashed id'
          type: string
          example: AS3df3A
          readOnly: true
        name:
          description: 'The design name'
          type: string
          example: Beauty
        design:
          description: 'The HTML sections of the design'
          type: object
          properties:
            includes:
              type: string
            header:
              type: string
            body:
              type: string
            product:
              type: string
            task:
              type: string
            footer:
              type: string
        is_custom:
          description: 'Flag to determine if the design is a custom user design'
          type: boolean
          example: true
        is_active:
          description: 'Flag to determine if the design is available for use'
          type: boolean
          example: true
        is_deleted:
          description: 'Flag to determine if the design is deleted'
          type: boolean
          example: true
        created_at:
          description: Timestamp
          type: integer
          example: 134341234234
        updated_at:
          description: Timestamp
          type: integer
          example: 134341234234
        archived_at:
          description: 'Timestamp'
          type: integer
        entities:
          description: 'A comma separated list of the entities the design can be used for'
          type: string
        is_free:
          description: 'Whether the design is free'
          type: boolean
        is_template:
          description: 'Whether the design is template'
          type: boolean
      type: object