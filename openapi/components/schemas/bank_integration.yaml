    BankIntegration:
      properties:
        id:
          description: 'The bank integration hashed id'
          type: string
          example: AS3df3A
          readOnly: true
        bank_account_id:
          description: 'The bank account id'
          type: integer
          example: 1233434
        bank_account_name:
          description: 'The name of the account'
          type: string
          example: 'My Checking Acc'
        bank_account_number:
          description: 'The account number'
          type: string
          example: '111 234 2332'
        bank_account_status:
          description: 'The status of the bank account'
          type: string
          example: ACTIVE
        bank_account_type:
          description: 'The type of account'
          type: string
          example: CREDITCARD
        balance:
          description: 'The current bank balance if available'
          type: number
          example: 1000000
        currency:
          description: 'iso_3166_3 code'
          type: string
          example: USD
        archived_at:
          description: 'Timestamp'
          type: integer
        auto_sync:
          description: 'The auto sync'
          type: boolean
        created_at:
          description: 'Timestamp'
          type: integer
        disabled_upstream:
          description: 'The disabled upstream'
          type: boolean
        from_date:
          description: 'The from date'
          type: string
        integration_type:
          description: 'The integration type'
          type: string
        is_deleted:
          description: 'Whether the bank integration has been deleted'
          type: boolean
        nickname:
          description: 'The nickname'
          type: string
        nordigen_institution_id:
          description: 'The nordigen institution id'
          type: string
        provider_id:
          description: 'The provider id'
          type: integer
        provider_name:
          description: 'The provider name'
          type: string
        updated_at:
          description: 'Timestamp'
          type: integer
      type: object