    RecurringExpense:
      properties:
        id:
          description: 'The hashed id of the recurring expense'
          type: string
          example: Opnel5aKBz
          readOnly: true
        user_id:
          description: 'The hashed id of the user who created the recurring expense'
          type: string
          example: Opnel5aKBz
        assigned_user_id:
          description: 'The hashed id of the user assigned to this recurring expense'
          type: string
          example: Opnel5aKBz
        client_id:
          description: 'The hashed id of the client'
          type: string
          example: Opnel5aKBz
        invoice_id:
          description: 'The hashed id of the invoice'
          type: string
          example: Opnel5aKBz
        bank_id:
          description: 'The id of the bank associated with this recurring expense'
          type: string
          example: '22'
        invoice_currency_id:
          description: 'The currency id of the invoice associated with this recurring expense'
          type: string
          example: "1"
        payment_type_id:
          description: 'The payment type id'
          type: string
          example: "1"
        private_notes:
          description: 'The recurring expense private notes'
          type: string
          example: 'Private and confidential'
        public_notes:
          description: 'The recurring expense public notes'
          type: string
          example: 'This is the best client in the world'
        transaction_reference:
          description: 'The recurring expense transaction reference'
          type: string
          example: EXP-1223-2333
        custom_value1:
          description: 'Custom value field'
          type: string
          example: $1000
        custom_value2:
          description: 'Custom value field'
          type: string
          example: '2022-10-10'
        custom_value3:
          description: 'Custom value field'
          type: string
          example: 'short text'
        custom_value4:
          description: 'Custom value field'
          type: string
          example: 'very long text'
        tax_name1:
          description: 'The tax name'
          type: string
          example: GST
        tax_name2:
          description: 'The tax name'
          type: string
          example: VAT
        tax_rate1:
          description: 'The tax rate'
          type: number
          format: float
          example: 10.00
        tax_rate2:
          description: 'The tax rate'
          type: number
          format: float
          example: 10.00
        tax_name3:
          description: 'The tax name'
          type: string
          example: ''
        tax_rate3:
          description: 'The tax rate'
          type: number
          format: float
          example: 10.00
        amount:
          description: 'The total amount of the recurring expense'
          type: number
          format: float
          example: 10.00
        frequency_id:
          description: 'How often an expense is created, as a frequency id string (see RecurringInvoice frequency_id), an empty string when not set'
          type: string
          example: '1'
        remaining_cycles:
          description: 'The number of remaining cycles for this recurring expense'
          type: integer
          example: 1
        foreign_amount:
          description: 'The foreign currency amount of the recurring expense'
          type: number
          format: float
          example: 10.00
        exchange_rate:
          description: 'The exchange rate for the expernse'
          type: number
          format: float
          example: 0.80
        date:
          description: 'The date of the expense'
          type: string
          example: ''
        payment_date:
          description: 'The date the expense was paid'
          type: string
          example: ''
        should_be_invoiced:
          description: 'Boolean flag determining if the expense should be invoiced'
          type: boolean
          example: true
        is_deleted:
          description: 'Boolean flag determining if the recurring expense is deleted'
          type: boolean
          example: true
        last_sent_date:
          description: 'The date the last expense was created, an empty string when not set'
          type: string
          example: '1994-07-30'
        next_send_date:
          description: 'The date the next expense is created, an empty string when not set'
          type: string
          example: '1994-07-30'
        invoice_documents:
          description: 'Boolean flag determining if the documents associated with this expense should be passed onto the invoice if it is converted to an invoice'
          type: boolean
          example: true
        updated_at:
          description: Timestamp
          type: integer
          example: 1434342123
        archived_at:
          description: Timestamp
          type: integer
          example: 1434342123
        calculate_tax_by_amount:
          description: 'Flag indicating whether to calculate tax based on amount rather than percentage'
          type: boolean
          example: true
        category_id:
          description: 'The unique identifier of the expense category'
          type: string
          example: Opnel5aKBz
        currency_id:
          description: 'The unique identifier of the currency'
          type: string
          example: "1"
        next_send_date_client:
          description: 'The next scheduled send date for the client'
          type: string
          format: date
          example: '2024-12-31'
          writeOnly: true
        number:
          description: 'The unique number assigned to this recurring expense'
          type: string
          example: 'RE-0001'
        project_id:
          description: 'The unique identifier of the project associated with this recurring expense'
          type: string
          example: Opnel5aKBz
        tax_amount1:
          description: 'The amount of the first tax'
          type: number
          format: float
          example: 10.00
        tax_amount2:
          description: 'The amount of the second tax'
          type: number
          format: float
          example: 5.00
        tax_amount3:
          description: 'The amount of the third tax'
          type: number
          format: float
          example: 2.50
        transaction_id:
          description: 'The unique identifier of the transaction'
          type: string
          example: 'txn_1234567890'
        uses_inclusive_taxes:
          description: 'Flag indicating whether taxes are included in the price'
          type: boolean
          example: true
        vendor_id:
          description: 'The unique identifier of the vendor associated with this recurring expense'
          type: string
          example: Opnel5aKBz
        tags:
          description: 'Tags assigned to this entity'
          type: array
          items:
            $ref: '#/components/schemas/TagAssignment'
        created_at:
          description: 'When the recurring expense was created, as a Unix timestamp in seconds'
          type: integer
        documents:
          description: 'The documents attached to the recurring expense'
          type: array
          items:
            $ref: '#/components/schemas/Document'
        entity_type:
          description: 'The type of the record, always "recurringExpense"'
          type: string
        recurring_dates:
          description: 'The upcoming dates a new expense is created on, only returned with ?show_dates=true; otherwise an empty array'
          type: array
          items:
            type: object
        recurring_expense_currency_id:
          description: 'Deprecated, always an empty string'
          type: string
        status_id:
          description: 'The status of the recurring expense: 1 draft, 2 active, 3 paused, 4 completed'
          type: string
      type: object
