          type: number
          format: float
          example: 10.00
        adjustment:
          description: 'The amount the client balance is adjusted by'
          type: number
          format: float
          example: 10.00
        updated_at:
          description: Timestamp
          type: integer
          example: 1434342123
        created_at:
          description: Timestamp
          type: integer
          example: 1434342123
        activity_id:
          description: 'The activity id'
          type: integer
        archived_at:
          description: 'Timestamp'
          type: integer
        credit_id:
          description: 'The credit id'
          type: string
        invoice_id:
          description: 'The invoice id'
          type: string
        client_id:
          description: 'The client hashed id, present when the entry belongs to a client'
          type: string
        payment_id:
          description: 'The payment hashed id, present when the entry belongs to a payment'
          type: string
      type: object