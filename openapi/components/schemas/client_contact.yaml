    ClientContact:
      properties:
        id:
          description: 'The hashed if of the contact'
          type: string
          example: Opnel5aKBz
          readOnly: true
        first_name:
          description: 'The first name of the contact'
          type: string
          example: John
        last_name:
          description: 'The last name of the contact'
          type: string
          example: Doe
        phone:
          description: 'The phone number of the contact'
          type: string
          example: 555-152-4524
        custom_value1:
          description: 'A Custom field value'
          type: string
          example: ''
        custom_value2:
          description: 'A Custom field value'
          type: string
          example: ''
        custom_value3:
          description: 'A Custom field value'
          type: string
          example: ''
        custom_value4:
          description: 'A Custom field value'
          type: string
          example: ''
        email:
          description: 'The email of the contact'
          type: string
          example: ''
        password:
          description: 'The hashed password of the contact'
          type: string
          example: '*****'
        contact_key:
          description: 'A unique identifier for the contact'
          type: string
          example: JD0X52bkfZlJRiroCJ0tcSiAjsJTntZ5uqKdiZ0a
          readOnly: true
        is_primary:
          description: 'Defines is this contact is the primary contact for the client'
          type: boolean
          example: true
        is_locked:
          description: 'Boolean value defines if the contact has been locked out.'
          type: boolean
          example: true
        send_email:
          description: 'Boolean value determines is this contact should receive emails'
          type: boolean
          example: true
        cc_only:
          description: 'When true this contact is only included as a CC recipient on outgoing emails and is not addressed directly.'
          type: boolean
          example: false
        can_sign:
          description: 'When true this contact is permitted to electronically sign invitations (invoices, quotes, credits, purchase orders, recurring invoices).'
          type: boolean
          example: false
        last_login:
          description: Timestamp
          type: integer
          example: 134341234234
          readOnly: true
        created_at:
          description: Timestamp
          type: integer
          example: 134341234234
          readOnly: true
        updated_at:
          description: Timestamp
          type: integer
          example: 134341234234
          readOnly: true
        archived_at:
          description: 'When the contact was archived, as a Unix timestamp in seconds; 0 when it is not archived'
          type: integer
        link:
          description: 'The client portal login link of the contact'
          type: string
      type: object