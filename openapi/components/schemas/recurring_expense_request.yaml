    RecurringExpenseRequest:
      description: 'The recurring expense fields a request can send: the RecurringExpense fields, plus inputs the API accepts but does not return'
      allOf:
        - $ref: '#/components/schemas/RecurringExpense'
        - type: object
          properties:
            next_send_date_client:
              description: 'The next scheduled send date for the client'
              type: string
              format: date
              example: '2024-12-31'
