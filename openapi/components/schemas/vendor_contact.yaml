    VendorContact:
      properties:
        id:
          description: 'The hashed id of the vendor contact'
          type: string
          example: Opnel5aKBz
          readOnly: true
        first_name:
          description: 'The first name of the contact'
          type: string
          example: Harry
        last_name:
          description: 'The last name of the contact'
          type: string
          example: Windsor
        phone:
          description: 'The contacts phone number'
          type: string
          example: 555-123-1234
        custom_value1:
          description: 'A custom value'
          type: string
          example: '2022-10-10'
        custom_value2:
          description: 'A custom value'
          type: string
          example: $1000
        custom_value3:
          description: 'A custom value'
          type: string
          example: ''
        custom_value4:
          description: 'A custom value'
          type: string
          example: ''
        email:
          description: 'The contact email address'
          type: string
          example: harry@windsor.com
        password:
          description: 'The hashed password of the contact'
          type: string
          example: '*****'
        is_primary:
          description: 'Boolean flag determining if the contact is the primary contact for the vendor'
          type: boolean
          example: true
        created_at:
          description: Timestamp
          type: integer
          example: 134341234234
          readOnly: true
        updated_at:
          description: Timestamp
          type: integer
          example: 134341234234
          readOnly: true
        send_email:
          description: 'Flag indicating whether to send emails to this contact'
          type: boolean
          example: true
        cc_only:
          description: 'When true this contact is only included as a CC recipient on outgoing emails and is not addressed directly.'
          type: boolean
          example: false
        can_sign:
          description: 'When true this contact is permitted to electronically sign purchase order invitations.'
          type: boolean
          example: false
        archived_at:
          description: 'When the contact was archived, as a Unix timestamp in seconds; 0 when it is not archived'
          type: integer
        last_login:
          description: 'When the contact last logged in to the vendor portal, as a Unix timestamp in seconds; 0 when never'
          type: integer
        link:
          description: 'The vendor portal login link of the contact'
          type: string
      type: object
