    Task:
      properties:
        id:
          description: 'The hashed id of the task'
          type: string
          example: Opnel5aKBz
          readOnly: true
        user_id:
          description: 'The hashed id of the user who created the task'
          type: string
          example: Opnel5aKBz
        assigned_user_id:
          description: 'The assigned user of the task'
          type: string
          example: Opnel5aKBz
        client_id:
          description: 'The hashed if of the client'
          type: string
          example: Opnel5aKBz
        invoice_id:
          description: 'The hashed id of the invoice associated with the task'
          type: string
          example: Opnel5aKBz
        project_id:
          description: 'The hashed id of the project associated with the task'
          type: string
          example: Opnel5aKBz
        number:
          description: 'The number of the task'
          type: string
          example: TASK-123
        time_log:
          description: 'An array of unix time stamps defining the start and end times of the task'
          type: string
          example: '[[1,2],[3,4]]'
        is_running:
          description: 'Determines if the task is still running'
          type: boolean
          example: true
        is_deleted:
          description: 'Boolean flag determining if the task has been deleted'
          type: boolean
          example: true
        description:
          description: 'The task description'
          type: string
          example: 'A wonder task to work on'
        duration:
          description: 'The task duration in seconds'
          type: integer
          example: 3600
        due_date:
          description: 'The due date of the task, an empty string when not set'
          type: string
          example: '2024-01-31'
        estimated_duration:
          description: 'The estimated duration of the task in seconds, null when not set'
          type: integer
          nullable: true
          example: 7200
        rate:
          description: 'The task rate'
          type: number
          example: 10.00
        custom_value1:
          description: 'A custom value'
          type: string
          example: '2022-10-10'
        custom_value2:
          description: 'A custom value'
          type: string
          example: $1100
        custom_value3:
          description: 'A custom value'
          type: string
          example: 'I need help'
        custom_value4:
          description: 'A custom value'
          type: string
          example: INV-3343
        is_date_based:
          description: 'Boolean flag determining if the task is date based'
          type: boolean
          example: true
        created_at:
          description: Timestamp
          type: integer
          example: 1434342123
          readOnly: true
        updated_at:
          description: Timestamp
          type: integer
          example: 1434342123
          readOnly: true
        archived_at:
          description: Timestamp
          type: integer
          example: 1434342123
          readOnly: true
        meta:
          description: 'Calendar sync data: calendar_event_id, the id of the calendar event linked to the task. An empty object when there is none'
          type: object
          additionalProperties: true
        status_id:
          description: 'The unique identifier of the task status'
          type: string
          example: Opnel5aKBz
        status_order:
          description: 'Sort order for status display, null when the task has not been sorted'
          type: integer
          nullable: true
          example: 1
        status_sort_order:
          description: 'Alternative sort order for status'
          type: integer
          example: 1
        tags:
          description: 'Tags assigned to the task'
          type: array
          items:
            $ref: '#/components/schemas/TagAssignment'
        date:
          description: 'The date the task''s first time log starts (YYYY-MM-DD), an empty string when the task has no time log'
          type: string
          example: '2024-01-15'
        documents:
          description: 'The documents attached to the task'
          type: array
          items:
            $ref: '#/components/schemas/Document'
        project:
          $ref: '#/components/schemas/Project'
      type: object
