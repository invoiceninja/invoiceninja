        vendor_id:
          description: 'The vendor associated with this documents'
          type: string
          example: ''
        name:
          description: 'The document name'
          type: string
          example: Beauty
        url:
          description: 'The document url'
          type: string
          example: Beauty
        preview:
          description: 'The document preview url'
          type: string
          example: Beauty
        type:
          description: 'The document type'
          type: string
          example: Beauty
        disk:
          description: 'The document disk'
          type: string
          example: Beauty
        hash:
          description: 'The document hashed'
          type: string
          example: Beauty
        is_deleted:
          description: 'Flag to determine if the document is deleted'
          type: boolean
          example: true
        is_default:
          description: 'Flag to determine if the document is a default doc'
          type: boolean
          example: true
        created_at:
          description: Timestamp
          type: integer
          example: 134341234234
        updated_at:
          description: Timestamp
          type: integer
          example: 134341234234
        archived_at:
          description: 'When the document was archived, as a Unix timestamp in seconds; 0 when it is not archived'
