    CompanyGateway:
      properties:
        id:
          description: 'The hashed id of the company gateway'
          type: string
          example: Opnel5aKBz
          readOnly: true
        gateway_key:
          description: 'The gateway key (hash)'
          type: string
          example: '2'
        accepted_credit_cards:
          description: 'Bitmask representation of cards'
          type: integer
          example: 32
        require_billing_address:
          description: 'Determines if the the billing address is required prior to payment.'
          type: boolean
          example: true
        require_shipping_address:
          description: 'Determines if the the billing address is required prior to payment.'
          type: boolean
          example: true
        config:
          description: 'The configuration map for the gateway'
          type: string
          example: dfadsfdsafsafd
        update_details:
          description: 'Determines if the client details should be updated.'
          type: boolean
          example: true
        fees_and_limits:
          description: 'The fees and limits for the configured gateway, keyed by gateway type id'
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FeesAndLimits'
        always_show_required_fields:
          description: 'Whether the required fields form is always shown at checkout'
          type: boolean
        archived_at:
          description: 'Timestamp'
          type: integer
        created_at:
          description: 'Timestamp'
          type: integer
        custom_value1:
          description: 'A custom value'
          type: string
        custom_value2:
          description: 'A custom value'
          type: string
        custom_value3:
          description: 'A custom value'
          type: string
        custom_value4:
          description: 'A custom value'
          type: string
        is_deleted:
          description: 'Whether the company gateway has been deleted'
          type: boolean
        label:
          description: 'The label shown for the gateway'
          type: string
        require_client_name:
          description: 'Whether to require client name'
          type: boolean
        require_client_phone:
          description: 'Whether to require client phone'
          type: boolean
        require_contact_email:
          description: 'Whether to require contact email'
          type: boolean
        require_contact_name:
          description: 'Whether to require contact name'
          type: boolean
        require_custom_value1:
          description: 'Whether to require custom value1'
          type: boolean
        require_custom_value2:
          description: 'Whether to require custom value2'
          type: boolean
        require_custom_value3:
          description: 'Whether to require custom value3'
          type: boolean
        require_custom_value4:
          description: 'Whether to require custom value4'
          type: boolean
        require_cvv:
          description: 'Whether to require cvv'
          type: boolean
        require_postal_code:
          description: 'Whether to require postal code'
          type: boolean
        require_zip:
          description: 'Whether to require zip'
          type: boolean
        settings:
          description: 'Gateway settings that override the company settings'
          type: object
          additionalProperties: true
        show_billing_address:
          description: 'Whether to show billing address'
          type: boolean
        show_shipping_address:
          description: 'Whether to show shipping address'
          type: boolean
        test_mode:
          description: 'Whether the gateway runs in test mode'
          type: boolean
        token_billing:
          description: 'When card details are saved: always, optin, optout or off'
          type: string
        updated_at:
          description: 'Timestamp'
          type: integer
      type: object
    
    