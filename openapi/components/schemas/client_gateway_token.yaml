    ClientGatewayToken:
      properties:
        id:
          description: 'The hashed id of the client gateway token'
          type: string
          example: Opnel5aKBz
          readOnly: true
        client_id:
          description: 'The hashed_id of the client'
          type: string
          example: '2'
          writeOnly: true
        token:
          description: 'The payment token'
          type: string
          example: '2'
        routing_number:
          description: 'THe bank account routing number'
          type: string
          example: '2'
          writeOnly: true
        company_gateway_id:
          description: 'The hashed id of the company gateway'
          type: string
          example: '2'
        is_default:
          description: 'Flag determining if the token is the default payment method'
          type: boolean
          example: true
        archived_at:
          description: 'Timestamp'
          type: integer
        created_at:
          description: 'Timestamp'
          type: integer
        gateway_customer_reference:
          description: 'The gateway customer reference'
          type: string
        gateway_type_id:
          description: 'The gateway type id'
          type: string
        is_deleted:
          description: 'Whether the client gateway token has been deleted'
          type: boolean
        meta:
          description: 'The meta'
          type: object
          additionalProperties: true
        updated_at:
          description: 'Timestamp'
          type: integer
      type: object