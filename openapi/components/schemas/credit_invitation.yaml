    CreditInvitation:
      properties:
        id:
          description: 'The entity invitation hashed id'
          type: string
          example: Opnel5aKBz
          readOnly: true
        client_contact_id: 
          description: 'The client contact hashed id'
          type: string
          example: Opnel5aKBz
        key:
          description: 'The invitation key'
          type: string
          example: Opnel5aKBz4343343566236gvbb
          readOnly: true
        link:
          description: 'The invitation link'
          type: string
          example: 'https://www.example.com/invitations/Opnel5aKBz4343343566236gvbb'
          readOnly: true
        sent_date:
          description: 'The invitation sent date (YYYY-MM-DD HH:MM:SS), an empty string when not set'
          type: string
          readOnly: true
        viewed_date:
          description: 'The invitation viewed date (YYYY-MM-DD HH:MM:SS), an empty string when not set'
          type: string
          readOnly: true
        opened_date:
          description: 'The invitation opened date (YYYY-MM-DD HH:MM:SS), an empty string when not set'
          type: string
          readOnly: true
        updated_at:
          description: 'Timestamp'
          type: integer
          example: 1434342123
          readOnly: true
        archived_at:
          description: 'Timestamp'
          type: integer
          example: 1434342123
          readOnly: true
        email_error:
          description: 'The email error'
          type: string
          example: 'The email error'
          readOnly: true
        email_status:
          description: 'The email status'
          type: string
          readOnly: true
        can_sign:
          description: 'Indicates whether the recipient contact may electronically sign this invitation. Mirrors the can_sign flag on the linked client contact at the time the invitation was issued.'
          type: boolean
          example: false
          readOnly: true
        created_at:
          description: 'When the invitation was created, as a Unix timestamp in seconds'
          type: integer
        message_id:
          description: 'The message id the mail provider returned for the last email sent for this invitation'
          type: string
