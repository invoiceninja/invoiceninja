          description: 'First Custom Surcharge'
          type: number
          format: float
          example: 10.00
        custom_surcharge2:
          description: 'Second Custom Surcharge'
          type: number
          format: float
          example: 10.00
        custom_surcharge3:
          description: 'Third Custom Surcharge'
          type: number
          format: float
          example: 10.00
        custom_surcharge4:
          description: 'Fourth Custom Surcharge'
          type: number
          format: float
          example: 10.00
        custom_surcharge_tax1:
          description: 'Toggles charging taxes on custom surcharge amounts'
          type: boolean
          example: true
        custom_surcharge_tax2:
          description: 'Toggles charging taxes on custom surcharge amounts'
          type: boolean
          example: true
        custom_surcharge_tax3:
          description: 'Toggles charging taxes on custom surcharge amounts'
          type: boolean
          example: true
        custom_surcharge_tax4:
          description: 'Toggles charging taxes on custom surcharge amounts'
          type: boolean
          example: true
        location_id:
          description: 'The client location id that this invoice relates to'
          type: string
          example: Opnel5aKBz
        auto_bill:
          description: 'Auto-billing configuration setting'
          type: string
          example: 'always'
        auto_bill_enabled:
          description: 'Flag indicating whether auto-billing is enabled'
          type: boolean
          example: true
        design_id:
          description: 'The unique identifier of the design template used for this recurring invoice'
          type: string
          example: Opnel5aKBz
        due_date_days:
          description: "The day of the month the invoices are due, 'terms' to use the payment terms or 'on_receipt'"
          type: string
          example: terms
        e_invoice:
          description: 'E-invoice configuration and data'
          type: object
          additionalProperties: true
        exchange_rate:
          description: 'The exchange rate used for currency conversion'
          type: number
          format: float
          example: 1.0
        project_id:
          description: 'The unique identifier of the project associated with this recurring invoice'
          type: string
          example: Opnel5aKBz
        vendor_id:
          description: 'The unique identifier of the vendor associated with this recurring invoice'
          type: string
          example: Opnel5aKBz
        tags:
          description: 'Tags assigned to this entity'
          type: array
          items:
            $ref: '#/components/schemas/TagAssignment'
        entity_type:
          description: 'The entity type identifier returned by the API'
          type: string
        has_tasks:
          description: 'Deprecated. Always false in current API versions.'
          type: boolean
          example: false
          deprecated: true
        has_expenses:
          description: 'Deprecated. Always false in current API versions.'
          type: boolean
          example: false
          deprecated: true
        created_at:
          description: 'When the recurring invoice was created, as a Unix timestamp in seconds'
          type: integer
          example: 1434342123
          readOnly: true
        documents:
          description: 'The documents attached to the recurring invoice'
          type: array
          items:
            $ref: '#/components/schemas/Document'
        invitations:
          description: 'The invitations of the recurring invoice'
          type: array
          items:
            type: object
        next_send_datetime:
          description: 'The date and time the next invoice is generated, in UTC (YYYY-MM-DD HH:MM:SS), an empty string when not set'
          type: string
        recurring_dates:
          description: 'The upcoming dates a new invoice is created on, only returned with ?show_dates=true; otherwise an empty array'
          type: array
          items:
            type: object
        subscription_id:
          description: 'The hashed id of the subscription that created the recurring invoice'
          type: string
      type: object
      
