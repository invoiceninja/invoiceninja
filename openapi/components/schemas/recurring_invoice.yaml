        private_notes:
          description: 'The private notes of the invoice'
          type: string
          example: 'These are some private notes'
        footer:
          description: 'The invoice footer notes'
          type: string
          example: ''
        custom_value1:
          description: 'A custom field value'
          type: string
          example: '2022-10-01'
        custom_value2:
          description: 'A custom field value'
          type: string
          example: 'Something custom'
        custom_value3:
          description: 'A custom field value'
          type: string
          example: ''
        custom_value4:
          description: 'A custom field value'
          type: string
          example: ''
        tax_name1:
          description: 'The tax name'
          type: string
          example: ''
        tax_name2:
          description: 'The tax name'
          type: string
          example: ''
        tax_rate1:
          description: 'The tax rate'
          type: number
          format: float
          example: 10.00
        tax_rate2:
          description: 'The tax rate'
          type: number
          format: float
          example: 10.00
        tax_name3:
          description: 'The tax name'
          type: string
          example: ''
        tax_rate3:
          description: 'The tax rate'
          type: number
          format: float
          example: 10.00
        total_taxes:
          description: 'The total taxes for the invoice'
          type: number
          format: float
          example: 10.00
        line_items:
          description: 'An array of objects which define the line items of the invoice'
          type: array
          items:
            $ref: '#/components/schemas/InvoiceItem'
        amount:
          description: 'The invoice amount'
          type: number
          format: float
          example: 10.00
        balance:
          description: 'The invoice balance'
          type: number
          format: float
          example: 10.00
        paid_to_date:
          description: 'The amount paid on the invoice to date'
          type: number
          format: float
          example: 10.00
        discount:
          description: 'The invoice discount, can be an amount or a percentage'
          type: number
          format: float
          example: 10.00
        partial:
          description: 'The deposit/partial amount'
          type: number
          format: float
          example: 10.00
        is_amount_discount:
          description: 'Flag determining if the discount is an amount or a percentage'
          type: boolean
          example: true
        is_deleted:
          description: 'Defines if the invoice has been deleted'
          type: boolean
          example: true
        uses_inclusive_taxes:
          description: 'Defines the type of taxes used as either inclusive or exclusive'
          type: boolean
          example: true
        date:
          description: 'The date of the recurring invoice, an empty string when not set'
          type: string
          example: '1994-07-30'
        last_sent_date:
          description: 'The date the last invoice was generated and sent, an empty string when not set'
          type: string
          example: '1994-07-30'
        next_send_date:
          description: 'The date the next invoice is generated, in the client time zone, an empty string when not set'
          type: string
          example: '1994-07-30'
        partial_due_date:
          description: 'The due date for the deposit/partial amount, an empty string when not set'
          type: string
          example: '1994-07-30'
        due_date:
          description: 'The due date of the recurring invoice, an empty string when not set. The generated invoices get their due date from due_date_days'
          type: string
          example: '1994-07-30'
        updated_at:
          description: Timestamp
          type: integer
          example: 1434342123
        archived_at:
          description: Timestamp
          type: integer
          example: 1434342123
