    User:
      properties:
        id:
          description: 'The hashed id of the user'
          type: string
          example: Opnel5aKBz
          readOnly: true
        first_name:
          description: 'The first name of the user'
          type: string
          example: Brad
        last_name:
          description: 'The last name of the user'
          type: string
          example: Pitt
        email:
          description: 'The users email address'
          type: string
          example: brad@pitt.com
        phone:
          description: 'The users phone number'
          type: string
          example: 555-1233-23232
        signature:
          description: 'The users sign off signature'
          type: string
          example: 'Have a nice day!'
        avatar:
          description: 'The users avatar'
          type: string
          example: 'https://url.to.your/avatar.png'
          writeOnly: true
        accepted_terms_version:
          description: 'The version of the invoice ninja terms that has been accepted by the user'
          type: string
          example: 1.0.1
          writeOnly: true
        oauth_user_id:
          description: 'The provider id of the oauth entity'
          type: string
          example: jkhasdf789as6f675sdf768sdfs
          writeOnly: true
        oauth_provider_id:
          description: 'The oauth entity id'
          type: string
          example: google
          readOnly: true
        language_id:
          description: 'The language id of the user'
          type: string
          example: "1"
        verified_phone_number:
          description: 'Boolean flag if the user has their phone verified. Required to settings up 2FA'
          type: boolean
          example: true
          readOnly: true
        has_password:
          description: 'Boolean flag determining if the user has a password'
          type: boolean
          example: true
          readOnly: true
        last_confirmed_email_address:
          description: 'The last confirmed email address of the user'
          type: string
          example: 'bob@gmail.com'
          readOnly: true
        custom_value1:
          description: 'A custom value'
          type: string
          example: 'Custom value 1'
        custom_value2:
          description: 'A custom value'
          type: string
          example: '$1000'
        custom_value3:
          description: 'A custom value'
          type: string
          example: 'Custom value 3'
        custom_value4:
          description: 'A custom value'
          type: string
          example: 'Custom value 4'
        is_deleted:
          description: 'Boolean flag determining if the user has been deleted'
          type: boolean
          example: true
          readOnly: true
        google_2fa_secret:
          description: 'Whether the user has two factor authentication enabled'
          type: boolean
          example: false
          readOnly: true
        passkey_enabled:
          description: 'Boolean flag if passkey auth is enabled for this user'
          type: boolean
          example: true
          readOnly: true
        passkey_count:
          description: 'The number of registered passkeys for this user'
          type: integer
          example: 2
          readOnly: true
        company_user:
            $ref: '#/components/schemas/CompanyUserRef'
        archived_at:
          description: 'When the user was archived, as a Unix timestamp in seconds; 0 when it is not archived'
          type: integer
        created_at:
          description: 'When the user was created, as a Unix timestamp in seconds'
          type: integer
        email_verified_at:
          description: 'When the user verified their email address, as a Unix timestamp in seconds; null when not verified'
          nullable: true
        last_login:
          description: 'When the user last logged in, as a Unix timestamp in seconds; 0 when never'
          type: integer
        oauth_user_token:
          description: 'Masked as *** when an OAuth token is stored, otherwise an empty string'
          type: string
        referral_code:
          description: 'The code that new accounts sign up with to be counted as referred by this user'
          type: string
        referral_meta:
          description: 'The number of accounts the user referred, by plan: free, pro and enterprise'
          type: object
          additionalProperties: true
        settings:
          description: 'The user''s settings, currently calendar_connection with the status and email of the connected calendar'
          type: object
          additionalProperties: true
        updated_at:
          description: 'When the user was last changed, as a Unix timestamp in seconds'
          type: integer
        user_logged_in_notification:
          description: 'Whether the user is emailed when they log in from a new IP address'
          type: boolean
      type: object
