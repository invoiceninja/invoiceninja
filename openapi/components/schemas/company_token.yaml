    CompanyToken:
      properties:
        name:
          description: 'The token name'
          type: string
          example: 'Token Name'
        token:
          description: 'The token value'
          type: string
          example: AS3df3jUUH765fhfd9KJuidj3JShjA
        is_system:
          description: 'Determines whether the token is created by the system rather than a user'
          type: boolean
          example: true
        archived_at:
          description: 'When the API token was archived, as a Unix timestamp in seconds; 0 when it is not archived'
          type: integer
        created_at:
          description: 'When the API token was created, as a Unix timestamp in seconds'
          type: integer
        id:
          description: 'The company token hashed id'
          type: string
        is_deleted:
          description: 'Whether the company token has been deleted'
          type: boolean
        updated_at:
          description: 'When the API token was last changed, as a Unix timestamp in seconds'
          type: integer
        user_id:
          description: 'The hashed id of the user the token belongs to'
          type: string
      type: object