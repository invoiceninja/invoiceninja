    CompanyToken:
      properties:
        name:
          description: 'The token name'
          type: string
          example: 'Token Name'
        token:
          description: 'The token value'
          type: string
          example: AS3df3jUUH765fhfd9KJuidj3JShjA
        is_system:
          description: 'Determines whether the token is created by the system rather than a user'
          type: boolean
          example: true
        archived_at:
          description: 'Timestamp'
          type: number
          format: integer
        created_at:
          description: 'Timestamp'
          type: number
          format: integer
        id:
          description: 'The company token hashed id'
          type: string
        is_deleted:
          description: 'Whether the company token has been deleted'
          type: boolean
        updated_at:
          description: 'Timestamp'
          type: number
          format: integer
        user_id:
          description: 'The user id'
          type: string
      type: object