    ChartDateRequest:
      type: object
      properties:
        date_range:
          type: string
          enum:
            - last7_days
            - last30_days
            - last365_days
            - this_month
            - last_month
            - this_quarter
            - last_quarter
            - this_year
            - last_year
            - all_time
            - custom
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        include_drafts:
          type: boolean
