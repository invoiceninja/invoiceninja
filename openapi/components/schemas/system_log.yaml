    SystemLog:
      properties:
        id:
          description: 'The account hashed id'
          type: string
          example: AS3df3A
          readOnly: true
        user_id:
          description: 'The user_id hashed id'
          type: string
          example: AS3df3A
        client_id:
          description: 'The client_id hashed id'
          type: string
          example: AS3df3A
        event_id:
          description: 'The Log Type ID'
          type: integer
          example: 1
        category_id:
          description: 'The Category Type ID'
          type: integer
          example: 1
        type_id:
          description: 'The Type Type ID'
          type: integer
          example: 1
        log:
          description: 'The log entry: an object, or a string for plain messages'
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: string
        updated_at:
          description: Timestamp
          type: integer
          example: 1434342123
        created_at:
          description: Timestamp
          type: integer
          example: 1434342123
        company_id:
          description: 'The hashed id of the company the log entry belongs to'
          type: string
      type: object