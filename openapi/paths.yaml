          ---

          **Example**

          ```bash
          curl -X POST 'https://invoiceninja.com/api/v1/import' \
            -H 'X-API-TOKEN: YOUR_API_TOKEN_HERE' \
            -H 'Content-Type: application/json' \
            -d '{
              "hash": "MvKeSwMnhAfgkzdYKgxM5ummxGbLIdNm",
              "import_type": "csv",
              "skip_header": true,
              "column_map": {
                "invoice": {
                  "mapping": {
                    "0": "client.name",
                    "1": "client.email",
                    "2": "",
                    "3": "invoice.number",
                    "4": "invoice.amount"
                  }
                }
              }
            }'
          ```
      operationId: postImport
      parameters:
        - $ref: "#/components/parameters/X-API-TOKEN"
        - $ref: "#/components/parameters/X-Requested-With"
        - $ref: "#/components/parameters/include"
      requestBody:
        description: "The column mapping and file reference for the import"
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - hash
                - import_type
                - column_map
              properties:
                hash:
                  type: string
                  description: "The unique file reference returned by the preimport endpoint."
                  example: "MvKeSwMnhAfgkzdYKgxM5ummxGbLIdNm"
                import_type:
                  type: string
                  description: "The source format of the import."
                  example: "csv"
                skip_header:
                  type: boolean
                  description: "When true, the first row of the CSV is treated as a header row and skipped during import."
                  default: true
                  example: true
                column_map:
                  type: object
                  description: "An object keyed by entity type. Each entity contains a mapping of CSV column indices to system fields."
                  additionalProperties:
                    type: object
                    properties:
                      mapping:
                        type: object
                        description: "Maps CSV column indices (as string keys) to system field names from the `available` array. Use an empty string to skip a column."
                        additionalProperties:
                          type: string
                        example:
                          "0": "client.name"
                          "1": "client.email"
                          "2": ""
                          "3": "invoice.number"
                          "4": "invoice.amount"
      responses:
        200:
          description: "The import has been queued. A notification email will be sent upon completion."
          headers:
            X-MINIMUM-CLIENT-VERSION:
              $ref: "#/components/headers/X-MINIMUM-CLIENT-VERSION"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Your import has started, we'll send you an email once it completes."
        401:
          $ref: "#/components/responses/401"
        403:
          $ref: "#/components/responses/403"
        422:
          $ref: "#/components/responses/422"
        default:
          $ref: "#/components/responses/default"
