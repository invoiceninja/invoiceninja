paths:

  /api/v1/login:
    post:
      x-codeSamples:
      - lang: php
        label: php
        source: |
          $ninja = new InvoiceNinja("your_token");
          
      - lang: curl
        label: curl
        source: |
          curl --request POST \
            --url 'https://demo.invoiceninja.com/api/v1/login?include=company,token' \
            --header 'X-API-TOKEN: YOUR_API_TOKEN_HERE' \
            --header 'X-Requested-With: XMLHttpRequest' \
            --header 'Accept: application/json'
      tags:
        - auth
      summary: "Login"
      description: |

      operationId: postLogin
      parameters:
        - $ref: "#/components/parameters/X-API-SECRET"
        - $ref: "#/components/parameters/X-API-TOKEN"
        - $ref: "#/components/parameters/X-Requested-With"
        - $ref: "#/components/parameters/login_include"
        - $ref: "#/components/parameters/include_static"
        - $ref: "#/components/parameters/clear_cache"
      requestBody:
        description: |
          User credentials

          ```json
          {
            "email" : "fred@flintstonze.com",
            "password" : "magicpassword123",
            "one_time_password" : "12345",
          }
          ```
        required: true
        content:
          application/json:
            schema:
              properties:
                email:
                  description: "The users email address."
                  type: string
                  example: "demo@invoiceninja.com"
                password:
                  description: "The user password. Optional when performing passkey passwordless login."
                  type: string
                  example: "Password0"
                one_time_password:
                  description: "The one time password if 2FA is enabled"
                  type: string
                  example: "123456"
                passkey_challenge_token:
                  description: "Challenge token returned by passkey login options or second-factor challenge."
                  type: string
                  example: "f8f0cf1f4f6c4de5b6d6c5d4a0f8e5b2b89e1f1a"
                passkey_authentication:
                  description: "WebAuthn assertion payload."
                  type: object
                  additionalProperties: true
              required:
                - email
              type: object
      responses:
        200:
          description: "Returns the company user object"
          headers:
            X-MINIMUM-CLIENT-VERSION:
              $ref: "#/components/headers/X-MINIMUM-CLIENT-VERSION"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompanyUser'
                  meta:
                    $ref: '#/components/schemas/Meta'
        401:
          $ref: "#/components/responses/401"
        403:
          $ref: "#/components/responses/403"
        422:
          $ref: "#/components/responses/422"
        429:
          $ref: "#/components/responses/429"
        5XX:
          description: 'Server error'
        default:
          $ref: "#/components/responses/default"

