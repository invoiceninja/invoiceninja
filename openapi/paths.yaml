  /api/v1/bank_transactions/match:
    post:
      tags:
        - bank_transactions
      summary: "Match transactions"
      description: |
        Matching invoices or a payment to a bank transactions.
        
        The API expects the id of the transaction along with either a comma separated list of invoice ids OR the payment id to associate the transaction to.

        Example for matching a transaction to two invoices:

        {"transactions":[{"id":"olejRl5ejN","invoice_ids":"JxboYBLegw,JxboYBLeXX"}]}

        Example for matching a transaction and a paymente:

        {"transactions":[{"id":"olejRl5ejN","payment_id":"JxboYBLeXf"}]}

        Matching expenses.

        You can match an existing expense within Invoice Ninja - or - create a new expense using the following:

        {"transactions":[{"id":"open5pld7A","vendor_id":"gl9avJnaG1","ninja_category_id":""}]}

        To match to an existing expense:

        {"transactions":[{"id":"Jxbo2qKagw","expense_id":"7N1aMM1aWm"}]}

      operationId: matchBankTransactions
      parameters:
        - $ref: "#/components/parameters/X-API-TOKEN"
        - $ref: "#/components/parameters/X-Requested-With"
        - $ref: "#/components/parameters/index"
      requestBody:
        description: "The bank transactions to match, each to invoices, a payment, expenses, or a new expense"
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - transactions
              properties:
                transactions:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                    properties:
                      id:
                        description: 'The hashed id of the bank transaction'
                        type: string
                      invoice_ids:
                        description: 'Comma separated hashed invoice ids to pay with a credit transaction'
                        type: string
                        nullable: true
                      payment_id:
                        description: 'The hashed id of an existing payment to link'
                        type: string
                        nullable: true
                      expense_id:
                        description: 'Comma separated hashed ids of existing expenses to link to a debit transaction'
                        type: string
                        nullable: true
                      vendor_id:
                        description: 'The hashed vendor id for the expense created from a debit transaction'
                        type: string
                        nullable: true
                      ninja_category_id:
                        description: 'The hashed expense category id for the created expense'
                        type: string
                        nullable: true
                      client_id:
                        description: 'The hashed client id for the created expense'
                        type: string
                        nullable: true
                      project_id:
                        description: 'The hashed project id for the created expense'
                        type: string
                        nullable: true
                      should_be_invoiced:
                        description: 'Whether the created expense should be invoiced'
                        type: boolean
      responses:
        200:
          description: "The Bulk Action response"
          headers:
            X-MINIMUM-CLIENT-VERSION:
              $ref: "#/components/headers/X-MINIMUM-CLIENT-VERSION"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BankTransaction'
                  meta:
                    $ref: '#/components/schemas/Meta'
        401:
          $ref: "#/components/responses/401"
        403:
          $ref: "#/components/responses/403"
        422:
          $ref: "#/components/responses/422"
        429:
          $ref: "#/components/responses/429"
        5XX:
          description: 'Server error'
        default:
          $ref: "#/components/responses/default"
