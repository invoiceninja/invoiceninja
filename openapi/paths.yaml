  /api/v1/preimport:
    post:
      tags:
        - imports
      summary: "Pre Import CSV data"
      description: |
          The preimport endpoint is the first step when importing CSV data into Invoice Ninja. It validates your file(s) and returns the column headers found in each CSV, allowing you to map them to system fields before performing the actual import.

          **How it works**

          1. Set `import_type` to indicate the entity type (e.g. `invoice`, `quote`, `client`, `product`, `payment`, `vendor`, `expense`).
          2. Attach one or more CSV files using the `files[]` parameter, keyed by entity type:
             - `files[invoice]` — invoice records
             - `files[client]` — client records
             - `files[product]` — product records
             - `files[payment]` — payment records
             - `files[vendor]` — vendor records
             - `files[expense]` — expense records
          3. The response returns the detected column headers for each uploaded file so you can build a field mapping for the subsequent `/api/v1/import` call.

          You may upload multiple entity files in a single request. Only include the entity types relevant to your import.

          **Example**

          ```bash
          curl -X POST 'https://invoiceninja.com/api/v1/preimport' \
            -H 'X-API-TOKEN: YOUR_API_TOKEN_HERE' \
            -H 'Accept: application/json' \
            -F 'import_type=invoice' \
            -F 'files[invoice]=@invoices.csv' \
            -F 'files[client]=@clients.csv'
          ```
      operationId: preimport
      parameters:
        - $ref: "#/components/parameters/X-API-TOKEN"
        - $ref: "#/components/parameters/X-Requested-With"
        - $ref: "#/components/parameters/include"
      requestBody:
        description: "The CSV file(s) and import type"
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - import_type
              properties:
                import_type:
                  type: string
                  description: "The type of import being performed"
                  example: "invoice"
                files[invoice]:
                  type: string
                  format: binary
                  description: "CSV file for invoices"
                files[client]:
                  type: string
                  format: binary
                  description: "CSV file for clients"
                files[product]:
                  type: string
                  format: binary
                  description: "CSV file for products"
                files[payment]:
                  type: string
                  format: binary
                  description: "CSV file for payments"
                files[vendor]:
                  type: string
                  format: binary
                  description: "CSV file for vendors"
                files[expense]:
                  type: string
                  format: binary
                  description: "CSV file for expenses"
      responses:
        200:
          description: |
            Returns a hash identifying the uploaded file(s) and a mappings object for each entity type submitted.

            - **hash** — A unique reference to the uploaded file(s). Pass this to `/api/v1/import` when executing the import.
            - **mappings** — An object keyed by entity type (e.g. `invoice`, `client`). Each entity contains:
              - **available** — The system fields that can be mapped to for this entity (e.g. `invoice.number`, `client.name`, `item.cost`).
              - **headers** — A two-dimensional array. The first element contains the column headers detected from your CSV. The second element contains a sample data row, useful for previewing values during field mapping.
              - **hints** — An array of suggested mappings, one per CSV column. Each value is an index into the `available` array representing the best-guess system field for that column, or `null` when no match could be determined.
          headers:
            X-MINIMUM-CLIENT-VERSION:
              $ref: "#/components/headers/X-MINIMUM-CLIENT-VERSION"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
          content:
            application/json:
              schema:
                type: object
                properties:
                  hash:
                    type: string
                    description: "Unique reference to the uploaded file(s), required for the subsequent import call."
                    example: "MvKeSwMnhAfgkzdYKgxM5ummxGbLIdNm"
                  mappings:
                    type: object
                    description: "An object keyed by entity type containing field mapping data for each uploaded CSV."
                    additionalProperties:
                      type: object
                      properties:
                        available:
                          type: array
                          description: "System fields available for mapping."
                          items:
                            type: string
                          example: ["invoice.number", "invoice.amount", "client.name", "item.quantity", "item.cost"]
                        headers:
                          type: array
                          description: "A two-element array: the first element is the CSV column headers, the second is a sample data row."
                          items:
                            type: array
                            items:
                              type: string
                          example: [["Client Name", "Invoice Number", "Amount"], ["Acme Corp", "INV-001", "1500.00"]]
                        hints:
                          type: array
                          description: "Suggested mapping indices into the `available` array for each CSV column. A value of null indicates no suggested match."
                          items:
                            type: integer
                            nullable: true
                          example: [4, 0, 2]
        401:
          $ref: "#/components/responses/401"
        403:
          $ref: "#/components/responses/403"
        422:
          $ref: "#/components/responses/422"
        default:
          $ref: "#/components/responses/default"
  /api/v1/import:
    post:
      tags:
        - imports
      summary: "Import CSV data"
      description: |
          The import endpoint executes the actual data import. Call this after `/api/v1/preimport` has returned the file hash, available fields, and column headers.

          Using the data from the preimport response, construct a `column_map` that tells the system how each CSV column maps to a system field. The import runs asynchronously — you will receive an email notification once it completes.

          **Request body**

          - **hash** — The unique file reference returned by `/api/v1/preimport`.
          - **import_type** — The source format (e.g. `csv`, `freshbooks`, `invoice2go`, `invoicely`).
          - **skip_header** — Set to `true` to skip the first row of the CSV (the header row).
          - **column_map** — An object keyed by entity type (e.g. `invoice`, `client`). Each entity contains:
            - **mapping** — An object where each key is the CSV column index (as a string) and each value is the target system field from the `available` array, or an empty string `""` to skip that column.

          ---

          ### Available mapping fields

          Each mapping value uses the format `entity.property`. The tables below list every available field per entity type.

          ### Data Matching:
          
          #### Client Matching:
            Matching a record to a client is performed by using the clients email address (first) or the clients (exact) name. If no match is found, a new client is created.

          #### Multi line item invoice/quote/credits/recurring invoice Matching:
            If you need to import multiple line items into an invoice (other other entity) you will want to assign the same (unique) invoice number to each row in the csv file, the system will group together lines where the invoice number is the same and create line items for each row.

