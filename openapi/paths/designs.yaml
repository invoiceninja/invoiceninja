
  /api/v1/designs/set/default:
    post:
      tags:
        - designs
      summary: 'Apply a default design'
      description: 'Sets a design as the default for an entity at the company, group or client settings level. Administrator only. Updates existing entities at company, group settings or client scope.'
      operationId: setDefaultDesign
      parameters:
        -
          $ref: '#/components/parameters/X-API-TOKEN'
        -
          $ref: '#/components/parameters/X-Requested-With'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesignDefaultRequest'
      responses:
        200:
          description: 'Default design'
          headers:
            X-MINIMUM-CLIENT-VERSION:
              $ref: '#/components/headers/X-MINIMUM-CLIENT-VERSION'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        422:
          $ref: '#/components/responses/422'
        default:
          $ref: '#/components/responses/default'