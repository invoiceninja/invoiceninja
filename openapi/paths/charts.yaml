
  /api/v1/charts/chart_summary:
    post:
      tags:
        - charts
      summary: 'Get dashboard chart summary'
      description: 'Returns the invoice, outstanding, payment and expense series for the dashboard chart between start_date and end_date, per currency id and aggregated under key 999. Requires administrator access or view_dashboard permission. Results retain the current user visibility scope.'
      operationId: getChartSummary
      parameters:
        -
          $ref: '#/components/parameters/X-API-TOKEN'
        -
          $ref: '#/components/parameters/X-Requested-With'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChartDateRequest'
      responses:
        200:
          description: 'Chart summary'
          headers:
            X-MINIMUM-CLIENT-VERSION:
              $ref: '#/components/headers/X-MINIMUM-CLIENT-VERSION'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
          content:
            application/json:
              schema:
                type: object
                properties:
                  start_date:
                    type: string
                  end_date:
                    type: string
                additionalProperties:
                  type: object
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        422:
          $ref: '#/components/responses/422'
        default:
          $ref: '#/components/responses/default'
