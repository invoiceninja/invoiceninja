  /api/v1/charts/cashflow_forecast:
    post:
      tags:
        - charts
      summary: 'Get cash flow forecast'
      description: 'Returns the projected inflows and outflows between start_date and end_date, grouped by bucket_type (monthly by default). Requires administrator access or view_dashboard permission. Results retain the current user visibility scope.'
      operationId: getCashflowForecast
      parameters:
        -
          $ref: '#/components/parameters/X-API-TOKEN'
        -
          $ref: '#/components/parameters/X-Requested-With'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChartForecastRequest'
      responses:
        200:
          description: 'Chart cashflow forecast'
          headers:
            X-MINIMUM-CLIENT-VERSION:
              $ref: '#/components/headers/X-MINIMUM-CLIENT-VERSION'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
          content:
            application/json:
              schema:
                type: object
                properties:
                  start_date:
                    type: string
                  end_date:
                    type: string
                  bucket_type:
                    type: string
                  buckets:
                    type: array
                    items:
                      type: object
                      properties:
                        period:
                          type: string
                        period_start:
                          type: string
                        period_end:
                          type: string
                        inflows:
                          type: object
                          additionalProperties: true
                        outflows:
                          type: object
                          additionalProperties: true
                        net:
                          type: number
                        weighted_net:
                          type: number
                        confidence:
                          type: number
                  totals:
                    type: object
                    properties:
                      total_inflows:
                        type: number
                      weighted_inflows:
                        type: number
                      total_outflows:
                        type: number
                      net:
                        type: number
                      weighted_net:
                        type: number
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        422:
          $ref: '#/components/responses/422'
        default:
          $ref: '#/components/responses/default'
