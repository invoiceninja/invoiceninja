  '/api/v1/charts/project_analytics/{project}':
    post:
      tags:
        - charts
      summary: 'Get project analytics'
      description: 'Returns the execution and financial datasets for the charts of a project. Draft invoices are included when include_drafts is true. Requires view access to an undeleted project. Results retain the current user visibility scope.'
      operationId: getProjectAnalytics
      parameters:
        -
          $ref: '#/components/parameters/X-API-TOKEN'
        -
          $ref: '#/components/parameters/X-Requested-With'
        -
          name: project
          in: path
          required: true
          description: 'Hashed entity ID.'
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChartDateRequest'
      responses:
