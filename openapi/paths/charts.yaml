
  /api/v1/charts/chart_summary:
    post:
      tags:
        - charts
      summary: 'Get dashboard chart summary'
      description: 'Requires administrator access or view_dashboard permission. Results retain the current user visibility scope.'
      operationId: getChartSummary
      parameters:
        -
          $ref: '#/components/parameters/X-API-TOKEN'
        -
          $ref: '#/components/parameters/X-Requested-With'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChartDateRequest'
      responses:
        200:
          description: 'Successful response.'
          content:
            application/json:
              schema:
                type: object
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        422:
          $ref: '#/components/responses/422'
