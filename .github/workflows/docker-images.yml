name: Build Docker images

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  app:
    name: Build application image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push application image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.local
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/filefor-net/invoice-ninja-app:main
            ${{ env.REGISTRY }}/filefor-net/invoice-ninja-app:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  ui:
    name: Build React UI image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push React UI image
        uses: docker/build-push-action@v7
        with:
          context: ./docker/ui
          platforms: linux/amd64
          push: true
          build-args: |
            UI_REF=cd450e17831a5c770bdeef23084ce5faa0679f4d
            VITE_API_URL=
          tags: |
            ${{ env.REGISTRY }}/filefor-net/invoice-ninja-ui:main
            ${{ env.REGISTRY }}/filefor-net/invoice-ninja-ui:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui
