map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ^~ /api/ {
        proxy_pass http://nginx;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    # Public Laravel routes must use the same HTTPS origin as the React UI.
    # The ^~ modifier keeps uploaded assets away from the SPA static-file rule.
    location ^~ /storage/ {
        proxy_pass http://nginx;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    location ^~ /client/ {
        proxy_pass http://nginx;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    location ^~ /documents/ {
        proxy_pass http://nginx;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    location ^~ /vendor/ {
        proxy_pass http://nginx;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    # Client portal interactions (including the PDF preview modal) are
    # handled by Laravel Livewire and must support POST requests.
    location ^~ /livewire/ {
        proxy_pass http://nginx;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    # The Laravel client portal serves its compiled assets and icons from
    # these public directories. Proxy them to the backend instead of looking
    # for them in the React admin image.
    location ~ ^/(?:build|build-admin|css|fonts|images|js|svg)/ {
        proxy_pass http://nginx;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
