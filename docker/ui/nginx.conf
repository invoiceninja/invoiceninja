map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Docker health checks should not pollute the user-facing access log.
    location = /healthz {
        access_log off;
        log_not_found off;
        return 204;
    }

    location = /favicon.ico {
        proxy_pass http://nginx/favicon.ico;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # The client portal is invitation-only. Do not expose a public landing or
    # password login form; clients enter through their unique document links.
    location = / {
        return 404;
    }

    location = /client {
        return 404;
    }

    location = /client/ {
        return 404;
    }

    location = /client/login {
        return 404;
    }

    location ^~ /client/login/ {
        return 404;
    }

    # The React administration UI is mounted below /control. Deep links are
    # handled by BrowserRouter using the matching basename configured at build.
    location = /control {
        return 301 /control/;
    }

    location ^~ /control/ {
        rewrite ^ /index.html break;
    }

    location = /control/payments/process/response {
        return 302 /payments/process/response;
    }

    # Laravel payment callback
    location = /payments/process/response {
        proxy_pass http://nginx;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location ^~ /api/ {
        proxy_pass http://nginx;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    # Public Laravel routes must use the same HTTPS origin as the React UI.
    # The ^~ modifier keeps uploaded assets away from the SPA static-file rule.
    location ^~ /storage/ {
        proxy_pass http://nginx;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    location ^~ /client/ {
        proxy_pass http://nginx;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    location ^~ /documents/ {
        proxy_pass http://nginx;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    location ^~ /vendor/ {
        proxy_pass http://nginx;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    # Client portal interactions (including the PDF preview modal) are
    # handled by Laravel Livewire and must support POST requests.
    location ^~ /livewire/ {
        proxy_pass http://nginx;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    # The Laravel client portal serves its compiled assets and icons from
    # these public directories. Proxy them to the backend instead of looking
    # for them in the React admin image.
    location ~ ^/(?:build|build-admin|css|fonts|images|js|svg)/ {
        proxy_pass http://nginx;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    # Preserve old admin bookmarks by moving them below the new control path.
    location / {
        return 302 /control$request_uri;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
